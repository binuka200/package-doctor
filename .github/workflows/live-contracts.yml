name: Live API contracts

# These hit real PyPI, OSV, ecosyste.ms, CISA and FIRST endpoints to catch
# upstream drift - a renamed field, a changed envelope, a new pagination cap -
# which unit tests with stubbed transport cannot see.
#
# Deliberately NOT part of pull-request CI: four third-party services have no
# business deciding whether somebody's PR is red. A failure here means the tool
# is now misreading real data and needs a fix, not that a contributor did
# anything wrong.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, early UTC
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # -rs reports skips, so an outage is visible in the log rather than
      # looking like a clean pass.
      - run: pytest -m live -q -rs
      # The map against the advisories it was curated from. New advisories land
      # every week; one that argues with an entry and is not named in a `why`
      # fails here, which is how a stale answer gets noticed instead of shipped.
      - run: python research/audit_map.py --strict
