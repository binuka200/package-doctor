name: Publish to PyPI

# Uploads through PyPI's trusted publishing: the `pypi` environment below and
# this file's name are what PyPI checks, and no API token exists anywhere.
#
# Runs when a GitHub release is published, or by hand for a given tag - the
# first upload of a version that was released before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The wheel once shipped without the exposure map, and an editable
      # install could not see it. Refuse to publish anything that lacks it.
      - run: unzip -l dist/*.whl | grep -q "package_doctor/data/exposure.toml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
