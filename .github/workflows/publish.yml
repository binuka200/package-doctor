name: Publish to PyPI

# Uploads through PyPI's trusted publishing: the `pypi` environment below and
# this file's name are what PyPI checks, and no API token exists anywhere.
#
# Runs when a GitHub release is published, or by hand for a given tag - the
# first upload of a version that was released before this workflow existed.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # The wheel once shipped without the exposure map, and an editable
      # install could not see it. Refuse to publish anything that lacks it.
      - run: unzip -l dist/*.whl | grep -q "package_doctor/data/exposure.toml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
