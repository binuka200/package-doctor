[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "package-doctor"
version = "0.1.0"
description = "Finds dependencies that sit at a trust boundary and have no one left to fix them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Binuka Jayaweera" }]
keywords = ["dependencies", "security", "supply-chain", "maintenance", "sbom"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "packaging>=24.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/binukajayaweera/package-doctor"
Issues = "https://github.com/binukajayaweera/package-doctor/issues"

[project.scripts]
package-doctor = "package_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/package_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, an `async def` test is an error rather than a silent skip on
# modern pytest - but setting it explicitly means new async tests just run.
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]
