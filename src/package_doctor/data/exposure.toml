[category.crypto]
label = "crypto"
description = "Cryptographic primitives, certificates, secrets and TLS"
consequence = "data access"
packages = [
  { name = "acme", why = "ACME protocol client under certbot; JWS-signed requests and challenge validation for certificate issuance" },
  { name = "argon2-cffi", why = "Argon2 password hashing; the verify decision" },
  { name = "argon2-cffi-bindings", why = "the C bindings under argon2-cffi" },
  { name = "asn1crypto", why = "parses ASN.1 structures - certificates, keys, CMS, OCSP responses - from the wire" },
  { name = "aws-encryption-sdk", why = "client-side envelope encryption; decrypts ciphertext and verifies its signature; GHSA-x5h4-9gqw-942j is streaming plaintext before a message signature is checked; that is integrity of encrypted data, not an authentication decision" },
  { name = "azure-keyvault-certificates", why = "fetches and manages certificates in Key Vault" },
  { name = "azure-keyvault-keys", why = "signs, verifies, wraps and unwraps with Key Vault keys; the same shelf as google-cloud-kms" },
  { name = "azure-keyvault-secrets", why = "fetches application secrets from Key Vault" },
  { name = "bcrypt", why = "bcrypt password hashing; checkpw is the login decision" },
  { name = "blake3", why = "cryptographic hash used for integrity checks and content addressing" },
  { name = "certbot", why = "ACME client that proves control of domains and installs certificates; the same shelf as acme" },
  { name = "certifi", why = "the CA bundle every TLS client trusts; a stale bundle keeps distrusted roots" },
  { name = "coincurve", why = "libsecp256k1 bindings for signing and verifying ECDSA signatures" },
  { name = "cryptg", why = "AES-IGE in C for Telethon; encrypts and decrypts MTProto payloads off the wire" },
  { name = "cryptography", why = "TLS, X.509 and primitives; every consumer's trust root" },
  { name = "ecdsa", why = "pure-Python ECDSA signing and verification; CVE-2024-23342 is a timing side channel the project declares out of scope" },
  { name = "eth-account", why = "signs Ethereum transactions and messages with local private keys; GHSA-v65g-f3cj-fjp4 is a ReDoS in its input parsing" },
  { name = "eth-keyfile", why = "encrypts and decrypts Ethereum private keys in keyfile format" },
  { name = "eth-keys", why = "Ethereum key generation, signing and signature recovery" },
  { name = "google-cloud-kms", why = "signs, verifies, encrypts and decrypts with Cloud KMS keys" },
  { name = "google-cloud-secret-manager", why = "fetches application secrets" },
  { name = "http-ece", why = "encrypted content encoding for Web Push; decrypts messages" },
  { name = "hvac", why = "HashiCorp Vault client; fetches secrets and tokens, and its own TLS settings decide who it trusts" },
  { name = "josepy", why = "JOSE implementation used by acme and certbot to sign requests and parse keys" },
  { name = "keyring", why = "stores and retrieves credentials from the system keychain" },
  { name = "matrix-nio", why = "Matrix client with end-to-end encryption; it parses events from the homeserver and room keys from other devices. GHSA-w4pr-4vjg-hffh accepted forwarded room keys from a device other than the one asked, letting a malicious homeserver insert keys; key authenticity inside its encryption is recorded under crypto" },
  { name = "msoffcrypto-tool", why = "decrypts password-protected Office files, parsing their encryption structures" },
  { name = "nacl", why = "an older packaging of libsodium bindings; the same shelf as pynacl" },
  { name = "ndg-httpsclient", why = "certificate verification for urllib2 over pyOpenSSL; the trust decision" },
  { name = "oscrypto", why = "TLS and crypto over the OS libraries; certificate validation" },
