# -------------------------------------------------------------------------
# Reviewed and deliberately NOT treated as exposed. This list exists so that
# "we checked" is distinguishable from "we never looked" - without it, metadata
# inference fires on names that merely sound security-adjacent.
#
# Each entry records why the obvious guess is wrong, as data rather than
# as a comment, so `explain` can show it and a reviewer can argue with it.

[reviewed]

# Shelves reviewed as a whole. A pattern matches normalised names, and any
# explicit entry anywhere in this file beats it, which is how the exceptions
# are recorded: apache-airflow-providers-fab is the auth manager and sits in
# [category.auth]; google-cloud-storage moves bytes and sits in [category.http];
# opentelemetry-instrumentation reads request attributes and sits in
# [category.http]. The rule covers the rest of each shelf.
families = [
  { pattern = "google-cloud-*", why = "generated API clients over google-api-core and grpcio; the transport underneath is the boundary, and the members that do more - storage, bigquery, kms, secret-manager, os-login, aiplatform - are listed above" },
  { pattern = "apache-airflow-providers-*", why = "hook and operator packages that run inside Airflow's own trust boundary over drivers and transports that are in the map; the providers with advisories of their own - fab, amazon, google, common-sql, mysql, ftp, smtp - are listed above" },
  { pattern = "llama-index-*", why = "integration shims over llama-index-core, which is in the map; the readers that load files are listed above" },
  { pattern = "dbt-*", why = "adapters and plugins over dbt-core, which is in the map for its SQL compilation" },
  { pattern = "types-*", why = "typing stubs; no runtime code" },
  { pattern = "*-stubs", why = "typing stubs; no runtime code" },
  { pattern = "mypy-boto3-*", why = "typing stubs for boto3 services; no runtime code" },
  { pattern = "opentelemetry-*", why = "telemetry egress: API, SDK, exporters and semantic conventions; opentelemetry-instrumentation, which reads inbound request attributes, is listed above" },
  { pattern = "azure-mgmt-*", why = "generated management-plane clients over azure-core, which is in the map" },
  { pattern = "nvidia-*", why = "CUDA runtime libraries; nothing arrives from outside" },
  { pattern = "cuda-*", why = "CUDA bindings and toolkit metapackages; nothing arrives from outside" },
  { pattern = "sphinxcontrib-*", why = "Sphinx extensions over trusted local sources" },
  { pattern = "pytest-*", why = "test plugins; they run under the developer's own tests" },
  { pattern = "click-*", why = "click extensions; argv is the operator's" },
  { pattern = "rich-*", why = "terminal rendering over rich" },
  { pattern = "spacy-*", why = "registered functions and loggers for spaCy; the model loading boundary is spacy itself" },
]

