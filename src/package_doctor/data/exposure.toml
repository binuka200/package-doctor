  { name = "mitmproxy", why = "enforces proxy authentication; GHSA-527g-3w9m-29hv is LDAP injection bypassing proxyauth, and GHSA-wg33-5h85-7q5p let proxy clients reach mitmweb's API, which the advisory says can escalate to code execution" },
