consequence = "code execution"
packages = [
  { name = "accelerate", why = "loads and dispatches checkpoints for transformers; torch.load underneath" },
  { name = "chromadb", why = "the server loads embedding models by repository name; GHSA-f4j7-r4q5-qw2c let an unauthenticated request supply a repository with trust_remote_code and run its code, and GHSA-36p7-vc44-83pf did the same with UPDATE_COLLECTION; GHSA-2wm9-hf6c-p5cr and GHSA-xph7-9rjv-w5fr are cross-tenant authorisation bypasses" },
