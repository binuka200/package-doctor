[category.deserialization]
label = "deserialization"
description = "Loading formats whose decoder can instantiate arbitrary objects or run code: pickle and everything built on it, unsafe YAML loaders, config that names classes"
consequence = "code execution"
packages = [
  { name = "apscheduler", why = "job stores pickle job state; an attacker who can write the store runs code" },
  { name = "celery", why = "consumes broker messages and deserialises task arguments; the pickle serializer is code execution, and GHSA-q4xr-rc97-m4xx is command injection from task arguments" },
  { name = "cloudpickle", why = "pickle with extended coverage; loading is arbitrary code execution by design" },
  { name = "dill", why = "pickle with extended coverage; loading is arbitrary code execution by design" },
  { name = "diskcache", why = "Cache.get() unpickles stored values; a writable cache dir is code execution (GHSA-r8gq-9x9w-jcpg)" },
  { name = "dramatiq", why = "decodes messages from the broker; its PickleEncoder turns a writable broker into code execution" },
  { name = "flask-caching", why = "cache backends unpickle entries; advisories cite unsafe deserialization" },
  { name = "huey", why = "tasks are serialised with pickle by default; a writable broker is code execution" },
  { name = "hydra-core", why = "instantiates the class named by _target_ in a config it is handed" },
  { name = "joblib", why = "joblib.load is pickle; model files from anywhere are code" },
  { name = "jsonpickle", why = "reconstructs arbitrary Python classes from JSON, which is code execution (CVE-2020-22083)" },
  { name = "nltk", why = "downloads and unpickles model data from an index; a pickled model is code" },
  { name = "numpy", why = "np.load with allow_pickle reconstructs arbitrary objects; the default was True until 1.16.3" },
  { name = "omegaconf", why = "resolvers evaluate expressions in config values; hydra builds objects from them" },
  { name = "oyaml", why = "drop-in wrapper over pyyaml; the same loaders" },
  { name = "pickleshare", why = "a pickle-backed shelf; a writable store is code execution" },
  { name = "pyaml", why = "pretty printer over pyyaml; loads through it" },
  { name = "pyarrow", why = "IPC and Parquet readers reconstructed PyExtensionType via pickle (CVE-2023-47248: arbitrary code execution)" },
  { name = "pyyaml", why = "yaml.load with the default Loader instantiated arbitrary objects until 5.1; unsafe loaders remain" },
  { name = "pyyaml-env-tag", why = "adds a constructor to pyyaml loaders; the loader class it runs under decides safety" },
  { name = "pyyaml-ft", why = "fork of pyyaml; the same loaders" },
  { name = "pyyaml-include", why = "an !include constructor that reads other files named in the document" },
  { name = "rq", why = "jobs are pickled into Redis and unpickled by workers; whoever can write the queue runs code" },
  { name = "ruamel-yaml", why = "YAML(typ='unsafe') and the legacy load() construct arbitrary Python objects" },
  { name = "ruamel-yaml-clib", why = "C parser under ruamel-yaml; memory safety of the same loader" },
  { name = "scapy", why = "parses raw packets from the wire; advisories cite unsafe deserialization of captures" },
  { name = "srsly", why = "spaCy's serialisers, including pickle; loading is code execution for that format" },
  { name = "tablib", why = "imports datasets from many formats, and its YAML import went through yaml.load until it was fixed" },
  { name = "tblib", why = "unpickles tracebacks through pickling_support; a pickle stream is code" },
]

