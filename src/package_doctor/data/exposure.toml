  { name = "botocore", why = "the signing, credential and endpoint layer under boto3" },
  { name = "casbin", why = "authorisation engine that evaluates policies to allow or deny a request" },
  { name = "dj-rest-auth", why = "login, logout, password reset and registration endpoints for Django REST framework" },
