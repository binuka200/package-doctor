# Which Python packages sit at a trust boundary.
#
# A package belongs here when it routinely handles data an attacker can
# influence: request bodies, uploaded files, tokens, markup, archives, queries,
# certificates, model weights. Staleness only matters for packages in this file
# - that is the whole point of the two-axis model, and it is why `six` going
# quiet is not a finding.
#
# Criteria for adding an entry:
#   1. The package parses, decodes, renders, verifies or transports data that
#      commonly originates outside the trust boundary, OR
#   2. it makes an authentication or authorisation decision, OR
#   3. it constructs queries or commands from caller-supplied values.
#
# An entry is a bare name or a table `{ name = "...", why = "..." }`. The
# second form records what convinced the curator - the advisory, the API, the
# reason the obvious guess is wrong - and is the one new entries should use.
# `package-doctor explain` shows it, and a reviewer can argue with a sentence
# where they could only shrug at a name.
#
# "Popular" is not a criterion. "Security-adjacent sounding" is not a criterion:
# `xxhash` and `mmh3` are hash functions and are deliberately NOT in [category.crypto],
# because they are not cryptographic. `tiktoken` tokenises text and is not auth.
# Both are recorded under [reviewed] instead.
#
# Curated against the top 3,000 PyPI packages by download count. PRs welcome -
# include the reasoning, not just the name.

schema_version = 5

# -------------------------------------------------------------------------

