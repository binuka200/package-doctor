[category.deserialization]
label = "deserialization"
description = "Loading formats whose decoder can instantiate arbitrary objects or run code: pickle and everything built on it, unsafe YAML loaders, config that names classes"
consequence = "code execution"
packages = [
  { name = "apache-airflow", why = "serialized DAGs and XComs cross from DAG authors and API users into the scheduler, API server and triggerer, where Airflow's security model says their code must not run: GHSA-2943-9672-r45w and GHSA-2r5m-76wx-56gx imported attacker-chosen classes from serialized DAG state, GHSA-wr76-29cr-67w8 and GHSA-mc4f-r875-v87w executed XCom payloads, and GHSA-9g2w-5f3v-mfmm deserialized Celery broker messages" },
  { name = "apscheduler", why = "job stores pickle job state; an attacker who can write the store runs code" },
  { name = "arq", why = "jobs are pickled into Redis by default and unpickled by workers; whoever can write the queue runs code" },
  { name = "azure-core", why = "the shared runtime under every Azure SDK; GHSA-jm66-cg57-jjv5 is deserialization of untrusted data (CWE-502)" },
  { name = "babel", why = "locale identifiers commonly come from the Accept-Language header, and CVE-2021-42771 (GHSA-h4m5-qpfp-3mpv) loaded a pickled locale .dat file named by that identifier through directory traversal, which is code execution" },
  { name = "bentoml", why = "model serving; GHSA-33xw-247w-6hmc is remote code execution via insecure deserialization, with path traversal and open redirect alongside" },
  { name = "celery", why = "consumes broker messages and deserialises task arguments; the pickle serializer is code execution, and GHSA-q4xr-rc97-m4xx is command injection from task arguments" },
  { name = "cloudpickle", why = "pickle with extended coverage; loading is arbitrary code execution by design" },
  { name = "confection", why = "resolves @registry function references named in a config it is handed and calls them, the same shape as hydra's _target_" },
  { name = "deepdiff", why = "Delta reconstructs objects from serialised diffs; GHSA-mw26-5g2v-hqw3 is class pollution leading to remote code execution" },
