# -------------------------------------------------------------------------
# Packages that release-age heuristics frequently mis-flag, because they are
# finished rather than abandoned and sit nowhere near a trust boundary.
# Presence here suppresses age-based reasoning but is still overridden by an
# unfixed advisory.

[stable]
# At a trust boundary and complete by design. These keep their exposure
# category but are exempt from age-based reasoning, because "no release in
# three years" is the intended state rather than a warning sign.
#
# A package only belongs here with: no advisory history at all, an unarchived
# repository, and a maintainer position that the library is finished. An
# archived repo or an unfixed advisory still escalates it immediately.
#
# defusedxml is the case that forced this list: it is the PSF-recommended
# defence against XML attacks, has never had an advisory, and was being
# reported as "exposed + no one home" - advice that would push someone toward
# a less safe parser.
mature = ["defusedxml"]

packages = [
  "annotated-types", "appdirs", "attrs", "backports-abc", "colorama", "contextlib2",
  "decorator", "distlib", "enum34", "filelock", "funcsigs", "future", "humanize",
  "inflection", "iniconfig", "ipaddress", "mdurl-stub", "mock", "monotonic",
  "packaging", "pathlib2", "platformdirs", "pluggy", "py", "pytz", "scandir",
  "shortuuid", "six", "sniffio", "tabulate", "termcolor", "text-unidecode", "toml",
  "tomli", "tomli-w", "tomlkit", "typing-extensions", "typing-inspection", "tzdata",
  "wcwidth",
]

# -------------------------------------------------------------------------
# Reviewed and deliberately NOT treated as exposed. This list exists so that
# "we checked" is distinguishable from "we never looked" - without it, metadata
# inference fires on names that merely sound security-adjacent.
#
# Each entry records why the obvious guess is wrong.
#
# Reviewed as families rather than one by one, being thin generated API wrappers
# or typing stubs whose real trust boundary is the transport underneath them
# (requests / httpx / grpcio, all covered above):
#   google-cloud-*
#   apache-airflow-providers-*
#   llama-index-*
#   dbt-*
#   types-*
#   mypy-boto3-*
#   boto3-stubs
#   opentelemetry-*
#   azure-mgmt-*
#   nvidia-*
#   sphinxcontrib-*
#   pytest-*

[reviewed]
not_exposed = [

  "absl-py",                      # flags and logging
  "aiohappyeyeballs",             # connection racing helper
  "aioresponses",                 # test double for aiohttp
  "aiosignal",                    # callback container
  "anyio",                        # async concurrency plumbing
  "argcomplete",                  # shell tab completion
  "asgi-correlation-id",          # adds a request id to logs
  "asgi-lifespan",                # drives ASGI startup and shutdown
  "asttokens",                    # AST source positions
  "backoff",                      # retry decorator
  "celery-types",                 # typing stubs
  "click",                        # CLI argument parsing
  "concurrent-log-handler",       # rotates local log files
  "curlify",                      # formats a request object as a curl command
  "db-dtypes",                    # pandas dtype definitions
  "dbt-adapters",                 # adapter protocol definitions
  "dj-database-url",              # expands a connection string into Django settings
  "django-health-check",          # liveness endpoints
  "django-js-asset",              # renders a script tag
  "django-silk",                  # request profiler
  "emoji",                        # emoji name lookup table
  "fake-useragent",               # returns user agent strings; parses nothing
  "fakeredis",                    # in-process test double, not a client
  "frozenlist",                   # immutable list
  "gitdb",                        # git object storage
  "gitpython",                    # git plumbing wrapper
  "greenlet",                     # coroutine primitives
  "griffe",                       # extracts Python API signatures; not cryptographic signatures
  "griffecli",                    # same as griffe
  "griffelib",                    # same as griffe
  "grpc-stubs",                   # typing stubs
  "hashids",                      # obfuscates integers; its own docs say it is not secure
  "hatchling",                    # build backend
  "importlib-metadata",           # distribution metadata access
  "ipykernel",                    # interactive kernel
