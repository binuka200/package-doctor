  { name = "djoser", why = "REST authentication for Django; GHSA-v49p-m6gh-747c is an authentication bypass" },
  { name = "docker-pycreds", why = "reads registry credentials from credential helpers for the docker client" },
  { name = "ecdsa", why = "verifies signatures callers rely on to accept a message as authentic; GHSA-8qxj-f9rh-9fg2 accepted non-DER signatures, making them malleable" },
