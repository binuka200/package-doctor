# Which Python packages sit at a trust boundary.
#
# A package belongs here when it routinely handles data an attacker can
# influence: request bodies, uploaded files, tokens, markup, archives, queries,
# certificates, model weights. Staleness only matters for packages in this file
# - that is the whole point of the two-axis model, and it is why `six` going
# quiet is not a finding.
#
# Criteria for adding an entry:
#   1. The package parses, decodes, renders, verifies or transports data that
#      commonly originates outside the trust boundary, OR
#   2. it makes an authentication or authorisation decision, OR
#   3. it constructs queries or commands from caller-supplied values.
#
# Every entry is a table `{ name = "...", why = "..." }`. The `why` records
# what convinced the curator - the advisory, the API, the reason the obvious
# guess is wrong. `package-doctor explain` shows it, and a reviewer can argue
# with a sentence where they could only shrug at a name. A bare name still
# loads, but CI refuses a new one without a reason.
#
# "Popular" is not a criterion. "Security-adjacent sounding" is not a criterion:
# `xxhash` and `mmh3` are hash functions and are deliberately NOT in [category.crypto],
# because they are not cryptographic. `tiktoken` tokenises text and is not auth.
# Both are recorded under [reviewed] instead. Nor is "developer tool" a reason
# to be here: black, ruff, mypy and pyinstaller work on the developer's own
# source. But a tool whose input is hostile by design - pefile, oletools,
# yara-python parse malware - is at a boundary like any other parser.
#
# A package can carry more than one category. The report takes the worst
# consequence among them, so `mlflow` is llm/agent for what it is and model
# loading for what its advisories say went wrong.
#
# Curated against the top 3,000 PyPI packages by download count. PRs welcome -
# include the reasoning, not just the name.

schema_version = 6

# -------------------------------------------------------------------------

[category.auth]
label = "auth/session"
description = "Authentication, authorisation, sessions and token handling"
consequence = "account takeover"
packages = [
  { name = "adal", why = "Azure AD token acquisition, replaced by msal but still pinned; issues and caches bearer tokens" },
  { name = "aiobotocore", why = "async botocore; signs requests with AWS credentials and refreshes them, the same shelf as boto3" },
